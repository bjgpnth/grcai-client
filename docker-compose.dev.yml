# gRCAi Client – development Compose
# Mounts repo so code changes on the host are visible in the container.
# Optionally mounts grcai-contracts when it lives at ../grcai-contracts (e.g. in grcai-mvp).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker exec -it grcai-client-dev ./ui.sh
#
# Set OPENAI_API_KEY and GRCAI_CENTRAL_URL in .env or export before `up`.
# To use contracts: place grcai-contracts next to grcai-client (e.g. grcai-mvp/grcai-contracts);
#   it will be mounted at /grcai/contracts and CONTRACTS_PATH will be set.

services:
  grcai-client-dev:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: grcai/client:latest
    container_name: grcai-client-dev
    volumes:
      - .:/grcai
      # Host config (env definitions). In container app reads from /config via GRCAI_CONFIG_HOME.
      - ${HOME}/config:/config
      # Sessions (evidence, IR, RCA outputs). Client-specific, sensitive; create on host if missing.
      - ${HOME}/grcai_sessions:/grcai/grcai_sessions
      # Contracts: mount when grcai-contracts is sibling (e.g. grcai-mvp). If missing, comment out next line (host dir would be created empty).
      - ../grcai-contracts:/grcai/contracts:ro
    working_dir: /grcai
    command: sleep infinity
    ports:
      - "8501:8501"
    environment:
      PYTHONUNBUFFERED: "1"
      GRCAI_REASONING_MODE: "remote"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      CONTRACTS_PATH: "/grcai/contracts"
      GRCAI_CONFIG_HOME: "/config"
      GRCAI_SESSIONS_HOME: "/grcai/grcai_sessions"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GRCAI_CENTRAL_URL: ${GRCAI_CENTRAL_URL:-http://host.docker.internal:8000}
    user: "0:0"
    tty: true
    stdin_open: true
